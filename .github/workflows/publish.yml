name: Publish to Hex

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: hex-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: hex

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.2"

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(elixir -e '
            contents = File.read!("mix.exs")
            [_, version] = Regex.run(~r/@version\s+"([^"]+)"/, contents)
            IO.write(version)
          ')"

          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version $tag_version does not match mix.exs version $project_version" >&2
            exit 1
          fi

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      - name: Publish package and documentation
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
